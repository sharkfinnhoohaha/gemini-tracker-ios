<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Usage Tracker — Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0d0d12;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-border: rgba(255,255,255,0.06);
            --text-primary: #f0f0f5;
            --text-secondary: rgba(240,240,245,0.5);
            --blue: #4A90E2;
            --blue-glow: rgba(74,144,226,0.35);
            --purple: #9B59B6;
            --green: #2ECC71;
            --green-glow: rgba(46,204,113,0.3);
            --orange: #F39C12;
            --orange-glow: rgba(243,156,18,0.3);
            --red: #E74C3C;
            --red-glow: rgba(231,76,60,0.3);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --radius: 16px;
        }

        html, body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text-primary);
            height: 100%;
            overflow: hidden;
        }

        /* ─── iPhone Frame ─── */
        .phone-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 390px; height: 844px;
            border-radius: 44px;
            border: 3px solid rgba(255,255,255,0.08);
            background: var(--bg);
            overflow: hidden;
            box-shadow:
                0 0 0 6px #111,
                0 30px 80px rgba(0,0,0,0.6);
        }

        /* Notch / Dynamic Island */
        .dynamic-island {
            position: absolute;
            top: 12px; left: 50%;
            transform: translateX(-50%);
            width: 120px; height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 100;
        }

        .screen {
            width: 100%; height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .screen::-webkit-scrollbar { display: none; }

        /* ─── Transitions ─── */
        .view { display: none; width: 100%; min-height: 100%; }
        .view.active { display: flex; }

        /* ═════════════════════════════
           LOGIN VIEW
           ═════════════════════════════ */
        #loginView {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 60px 32px 40px;
            animation: fadeUp 0.6s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-orb {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px var(--blue-glow);
            animation: pulse 3s ease-in-out infinite alternate;
        }
        @keyframes pulse {
            from { box-shadow: 0 10px 40px var(--blue-glow); }
            to   { box-shadow: 0 15px 60px rgba(155,89,182,0.4); }
        }
        .logo-orb svg { width: 52px; height: 52px; fill: white; }

        .login-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .login-subtitle {
            color: var(--text-secondary);
            font-size: 15px;
            text-align: center;
            line-height: 1.5;
            max-width: 280px;
        }

        .google-btn {
            display: flex; align-items: center; gap: 12px;
            width: 100%; max-width: 310px;
            padding: 16px 24px;
            border-radius: 14px;
            background: var(--blue);
            color: white;
            font-size: 16px;
            font-weight: 600;
            font-family: var(--font);
            border: none;
            cursor: pointer;
            justify-content: center;
            box-shadow: 0 4px 20px var(--blue-glow);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--blue-glow);
        }
        .google-btn:active { transform: scale(0.97); }
        .google-btn svg { width: 22px; height: 22px; }

        .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ═════════════════════════════
           DASHBOARD VIEW
           ═════════════════════════════ */
        #dashboardView {
            flex-direction: column;
            gap: 0;
            padding: 0;
            background: linear-gradient(180deg, var(--bg) 0%, rgba(74,144,226,0.04) 100%);
        }

        .dash-header {
            padding: 60px 24px 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }
        .dash-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .dash-header p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .logout-btn {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid var(--bg-card-border);
            background: var(--bg-card);
            color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
            margin-top: 4px;
        }
        .logout-btn:hover { background: rgba(255,255,255,0.08); }
        .logout-btn svg { width: 18px; height: 18px; }

        .dash-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 20px 40px;
            animation: fadeUp 0.5s ease-out;
        }

        /* ─── Glass Card ─── */
        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius);
            padding: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* ─── Progress Bar ─── */
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .progress-title {
            font-size: 14px;
            font-weight: 600;
        }
        .progress-pct {
            font-size: 13px;
            font-weight: 700;
        }

        .progress-track {
            height: 14px;
            background: rgba(255,255,255,0.06);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            border-radius: 8px;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 8px;
            background: linear-gradient(90deg, transparent 60%, rgba(255,255,255,0.15));
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Color variants */
        .fill-orange {
            background: linear-gradient(90deg, rgba(243,156,18,0.65), var(--orange));
            box-shadow: 0 2px 12px var(--orange-glow);
        }
        .fill-red {
            background: linear-gradient(90deg, rgba(231,76,60,0.65), var(--red));
            box-shadow: 0 2px 12px var(--red-glow);
        }
        .fill-green {
            background: linear-gradient(90deg, rgba(46,204,113,0.65), var(--green));
            box-shadow: 0 2px 12px var(--green-glow);
        }

        /* ─── Projection Card ─── */
        .projection-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(74,144,226,0.08);
            border: 1px solid rgba(74,144,226,0.12);
        }
        .projection-card .label {
            font-size: 14px; font-weight: 600;
        }
        .projection-card .value {
            font-size: 22px; font-weight: 800;
            color: var(--blue);
            margin-top: 6px;
        }
        .projection-icon {
            font-size: 32px;
            opacity: 0.4;
        }

        /* ─── Chart ─── */
        .chart-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .chart-container {
            position: relative;
            width: 100%;
            height: 180px;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ─── Rate Limit Table ─── */
        .rate-table {
            width: 100%;
            border-collapse: collapse;
        }
        .rate-table th {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            font-weight: 600;
            text-align: left;
            padding: 0 0 12px;
        }
        .rate-table td {
            font-size: 13px;
            padding: 8px 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .rate-table td:last-child { text-align: right; }
        .rate-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-ok { background: rgba(46,204,113,0.15); color: var(--green); }
        .badge-warn { background: rgba(243,156,18,0.15); color: var(--orange); }
        .badge-crit { background: rgba(231,76,60,0.15); color: var(--red); }

        /* ─── Model Selector Pill ─── */
        .model-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(155,89,182,0.12);
            border: 1px solid rgba(155,89,182,0.2);
            font-size: 12px;
            font-weight: 600;
            color: #c79bf2;
            margin-bottom: 8px;
        }
        .model-pill .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--green);
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Loading skeleton */
        .skeleton {
            height: 120px;
            border-radius: var(--radius);
            background: linear-gradient(110deg, rgba(255,255,255,0.02) 8%, rgba(255,255,255,0.06) 18%, rgba(255,255,255,0.02) 33%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="dynamic-island"></div>
    <div class="screen">

        <!-- ════ LOGIN ════ -->
        <div id="loginView" class="view active">
            <div class="logo-orb">
                <svg viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61z"/></svg>
            </div>
            <div style="text-align:center">
                <div class="login-title">Gemini Tracker</div>
                <p class="login-subtitle" style="margin-top:12px">Monitor your API usage and rate limits securely.</p>
            </div>
            <div id="loginAction">
                <button class="google-btn" onclick="handleSignIn()">
                    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><text x="12" y="16" text-anchor="middle" fill="#4A90E2" font-size="13" font-weight="bold" font-family="Inter">G</text></svg>
                    Sign in with Google
                </button>
            </div>
        </div>

        <!-- ════ DASHBOARD ════ -->
        <div id="dashboardView" class="view">
            <div class="dash-header">
                <div>
                    <h1>Gemini API Tracker</h1>
                    <p>Welcome back, Finn Bennett</p>
                </div>
                <button class="logout-btn" onclick="handleSignOut()" title="Sign Out">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>

            <div class="dash-content" id="dashContent">
                <!-- Populated by JS -->
            </div>
        </div>

    </div>
</div>

<script>
// ── Mock Data ──
const MOCK = {
    model: "Gemini 2.5 Pro",
    tokensUsed: 1_250_000,
    tokensLimit: 2_000_000,
    requestsUsed: 420,
    requestsLimit: 500,
    rateLimits: [
        { metric: "Requests / min", current: 14, limit: 15, status: "warn" },
        { metric: "Tokens / min",   current: 28_000, limit: 32_000, status: "ok" },
        { metric: "Requests / day", current: 420, limit: 500, status: "crit" },
    ],
    history: generateHistory(7),
};

function generateHistory(days) {
    const data = [];
    const now = new Date();
    for (let i = days - 1; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        const base = 50000;
        const noise = Math.floor(Math.random() * 30000) - 10000;
        const trend = i < 3 ? 40000 : 0;
        data.push({ date: d, tokens: Math.max(0, base + noise + trend) });
    }
    return data;
}

function fmt(n) {
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + "M";
    if (n >= 1_000) return (n / 1_000).toFixed(1) + "K";
    return n.toString();
}

function pctColor(pct) {
    if (pct < 0.6) return { cls: "fill-green", hex: "#2ECC71" };
    if (pct < 0.85) return { cls: "fill-orange", hex: "#F39C12" };
    return { cls: "fill-red", hex: "#E74C3C" };
}

function projectedEOM() {
    const today = new Date();
    const day = today.getDate();
    const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
    return Math.round((MOCK.tokensUsed / day) * daysInMonth);
}

// ── Navigation ──
function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function handleSignIn() {
    const action = document.getElementById('loginAction');
    action.innerHTML = '<div class="spinner"></div>';
    setTimeout(() => {
        showView('dashboardView');
        renderDashboard();
    }, 1400);
}

function handleSignOut() {
    const action = document.getElementById('loginAction');
    action.innerHTML = `<button class="google-btn" onclick="handleSignIn()">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/><text x="12" y="16" text-anchor="middle" fill="#4A90E2" font-size="13" font-weight="bold" font-family="Inter">G</text></svg>
        Sign in with Google
    </button>`;
    showView('loginView');
}

// ── Render Dashboard ──
function renderDashboard() {
    const el = document.getElementById('dashContent');
    const tokPct = MOCK.tokensUsed / MOCK.tokensLimit;
    const reqPct = MOCK.requestsUsed / MOCK.requestsLimit;
    const tokColor = pctColor(tokPct);
    const reqColor = pctColor(reqPct);
    const proj = projectedEOM();

    el.innerHTML = `
        <div class="model-pill"><span class="dot"></span>${MOCK.model} — Active</div>

        <!-- Token Usage -->
        <div class="glass-card">
            <div class="progress-header">
                <span class="progress-title">Token Usage</span>
                <span class="progress-pct" style="color:${tokColor.hex}">${Math.round(tokPct * 100)}%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill ${tokColor.cls}" id="tokenBar"></div>
            </div>
            <div class="progress-labels">
                <span>${fmt(MOCK.tokensUsed)} used</span>
                <span>${fmt(MOCK.tokensLimit)} limit</span>
            </div>
        </div>

        <!-- Request Usage -->
        <div class="glass-card">
            <div class="progress-header">
                <span class="progress-title">Daily Requests</span>
                <span class="progress-pct" style="color:${reqColor.hex}">${Math.round(reqPct * 100)}%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill ${reqColor.cls}" id="reqBar"></div>
            </div>
            <div class="progress-labels">
                <span>${MOCK.requestsUsed} used</span>
                <span>${MOCK.requestsLimit} limit</span>
            </div>
        </div>

        <!-- Projection -->
        <div class="glass-card projection-card">
            <div>
                <div class="label">Projected End of Month</div>
                <div class="value">${fmt(proj)} tokens</div>
            </div>
            <div class="projection-icon">📈</div>
        </div>

        <!-- Rate Limits Table -->
        <div class="glass-card">
            <div class="chart-title">Current Rate Limits</div>
            <table class="rate-table">
                <thead><tr><th>Metric</th><th>Current</th><th>Limit</th><th style="text-align:right">Status</th></tr></thead>
                <tbody>
                    ${MOCK.rateLimits.map(r => `
                        <tr>
                            <td>${r.metric}</td>
                            <td>${fmt(r.current)}</td>
                            <td>${fmt(r.limit)}</td>
                            <td style="text-align:right"><span class="rate-badge badge-${r.status}">${r.status === 'ok' ? 'OK' : r.status === 'warn' ? 'Near Limit' : 'Critical'}</span></td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>

        <!-- Historical Chart -->
        <div class="glass-card">
            <div class="chart-title">Usage History (7 Days)</div>
            <div class="chart-container">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    `;

    // Animate progress bars
    requestAnimationFrame(() => {
        setTimeout(() => {
            document.getElementById('tokenBar').style.width = (tokPct * 100) + '%';
            document.getElementById('reqBar').style.width = (reqPct * 100) + '%';
        }, 100);
    });

    // Draw chart (vanilla canvas)
    drawChart();
}

function drawChart() {
    const canvas = document.getElementById('historyChart');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;

    const data = MOCK.history;
    const maxY = Math.max(...data.map(d => d.tokens)) * 1.15;
    const padBottom = 28, padTop = 8, padLeft = 0, padRight = 0;
    const chartW = W - padLeft - padRight;
    const chartH = H - padTop - padBottom;

    function x(i) { return padLeft + (i / (data.length - 1)) * chartW; }
    function y(v) { return padTop + chartH - (v / maxY) * chartH; }

    // Grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const yy = padTop + (chartH / 4) * i;
        ctx.beginPath(); ctx.moveTo(padLeft, yy); ctx.lineTo(W - padRight, yy); ctx.stroke();
    }

    // Area fill
    const grad = ctx.createLinearGradient(0, padTop, 0, H - padBottom);
    grad.addColorStop(0, 'rgba(74,144,226,0.35)');
    grad.addColorStop(1, 'rgba(74,144,226,0.02)');
    ctx.beginPath();
    ctx.moveTo(x(0), y(0));
    for (let i = 0; i < data.length; i++) ctx.lineTo(x(i), y(data[i].tokens));
    ctx.lineTo(x(data.length - 1), H - padBottom);
    ctx.lineTo(x(0), H - padBottom);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Line
    ctx.beginPath();
    for (let i = 0; i < data.length; i++) {
        if (i === 0) ctx.moveTo(x(i), y(data[i].tokens));
        else ctx.lineTo(x(i), y(data[i].tokens));
    }
    ctx.strokeStyle = '#4A90E2';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Dots
    for (let i = 0; i < data.length; i++) {
        ctx.beginPath();
        ctx.arc(x(i), y(data[i].tokens), 4, 0, Math.PI * 2);
        ctx.fillStyle = '#4A90E2';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x(i), y(data[i].tokens), 2, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
    }

    // X labels
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'center';
    const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    for (let i = 0; i < data.length; i++) {
        ctx.fillText(days[data[i].date.getDay()], x(i), H - 6);
    }
}
</script>

</body>
</html>
